<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us | Sahyog College</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Main CSS -->
  <link rel="stylesheet" href="css/main_css.css">

  <!-- Favicon -->
  <link rel="icon" href="images/img3.jpg">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg custom-navbar">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="index.html">
      <img src="images/img3.jpg" class="logo-img">
      <span class="brand-text">Sahyog College</span>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
        <li class="nav-item"><a class="nav-link" href="courses.html">Courses</a></li>
        <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- PAGE HEADER -->
<section class="container py-5 text-center">
  <h1 class="section-title">Contact Us</h1>
  <p class="section-text">
    Have questions about admissions or courses? We’re here to help.
  </p>
</section>

<!-- CONTACT FORM -->
<section class="container pb-5">
  <div class="row justify-content-center">
    <div class="col-lg-6">

      <div class="course-card">
        <div class="course-body">

          <!-- SUCCESS MESSAGE -->
          <div id="successMsg" class="alert alert-success d-none">
            Thank you! Your inquiry has been submitted successfully.
          </div>

          <form id="contactForm">

            <!-- COURSE DROPDOWN -->
            <div class="mb-3">
              <label class="form-label">Course Interested In</label>
              <select class="form-select" id="courseSelect" required>
                <option value="">Select a course</option>

                <!-- IT -->
                <option>B.Sc. Information Technology</option>
                <option>Bachelor of Computer Applications (BCA)</option>

                <!-- Commerce -->
                <option>Bachelor of Accounting & Finance (BAF)</option>
                <option>Bachelor of Management Studies (BMS)</option>
                <option>Bachelor of Commerce (B.Com)</option>

                <!-- Hotel Management -->
                <option>Bachelor of Hotel Management (BHM)</option>
                <option>Diploma in Hotel Management</option>
                <option>Certificate in Hospitality Operations</option>
              </select>
            </div>

            <!-- NAME -->
            <div class="mb-3">
              <label class="form-label">Full Name</label>
              <input type="text" class="form-control" required>
            </div>

            <!-- EMAIL -->
            <div class="mb-3">
              <label class="form-label">Email Address</label>
              <input type="email" class="form-control" required>
            </div>

            <!-- MESSAGE -->
            <div class="mb-3">
              <label class="form-label">Message</label>
              <textarea class="form-control" rows="4"></textarea>
            </div>

            <!-- SUBMIT -->
            <button type="submit" class="course-btn">
              Submit Inquiry
            </button>

          </form>

        </div>
      </div>

    </div>
  </div>
</section>

<!-- CONTACT INFO + MAP -->
<section class="container pb-5">
  <div class="row g-4">

    <!-- INFO -->
    <div class="col-md-5">
      <h5>Sahyog College</h5>
      <p>
        Thane (West), Maharashtra<br>
        Phone: +91 8422882284<br>
        Email: info@sahyogcollege.com
      </p>
    </div>

    <!-- MAP -->
    <div class="col-md-7">
      <iframe
        src="https://www.google.com/maps?q=Thane%20West%20Maharashtra&output=embed"
        width="100%"
        height="250"
        style="border:0;"
        allowfullscreen=""
        loading="lazy">
      </iframe>
    </div>

  </div>
</section>

<!-- SCRIPT: AUTO SELECT COURSE + SUCCESS MESSAGE -->
<script>
  // Auto-select course from URL
  const params = new URLSearchParams(window.location.search);
  const course = params.get("course");
  if (course) {
    document.getElementById("courseSelect").value = decodeURIComponent(course);
  }

  // Fake submit success
  document.getElementById("contactForm").addEventListener("submit", function(e) {
    e.preventDefault();
    document.getElementById("successMsg").classList.remove("d-none");
    this.reset();
  });
</script>

</body>
</html>
